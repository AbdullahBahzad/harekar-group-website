name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated code, and nothing that imports it will
      # typecheck until it exists. It is not in the repo, so this has to run
      # before any of the checks below.
      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The build catches what the two checks above cannot: bad route exports,
      # server/client boundary violations, and anything that only fails when
      # Next actually assembles the app.
      #
      # DATABASE_URL is a syntactically valid placeholder. Prisma refuses to
      # load without one, and no query runs at build time — every page that
      # touches the database does so behind `orPreview`, which falls back when
      # the connection fails.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
          APP_URL: http://localhost:3000
